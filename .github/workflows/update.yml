name: Auslastung aktualisieren

on:
  schedule:
    - cron: "*/15 5-21 * * *"   # alle 15 Minuten, ca. 6–23 Uhr deutscher Zeit (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scrape.mjs
      - name: Daten speichern
        run: |
          git config user.name "kart-bot"
          git config user.email "kart-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Auslastung $(TZ=Europe/Berlin date +'%d.%m. %H:%M')" && git push)
