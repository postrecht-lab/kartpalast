name: Auslastung aktualisieren

# GitHub startet zeitgesteuerte Läufe nicht zuverlässig. Deshalb wird stündlich
# ein Lauf angestoßen, der dann selbst bis zu knapp 6 Stunden aktiv bleibt und
# alle 15 Minuten aktualisiert. Läuft schon einer, wartet der nächste.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Testlauf (einmal, auch nachts, mit Fehlersuche)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Nachtpause prüfen
        id: night
        run: |
          H=$(TZ=Europe/Berlin date +%-H)
          if [ "${{ inputs.test }}" != "true" ] && { [ "$H" -ge 23 ] || [ "$H" -lt 6 ]; }; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Nachtpause"; fi
      - if: steps.night.outputs.skip != '1'
        uses: actions/checkout@v4
      - if: steps.night.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.night.outputs.skip != '1'
        run: npm install --no-save playwright@1.56.1
      - if: steps.night.outputs.skip != '1'
        run: npx playwright install --with-deps chromium
      - name: Alle 15 Minuten aktualisieren
        if: steps.night.outputs.skip != '1'
        env:
          TEST: ${{ inputs.test }}
          KART_DEBUG: ${{ inputs.test && '1' || '' }}
        run: |
          git config user.name "kart-bot"
          git config user.email "kart-bot@users.noreply.github.com"
          END=$((SECONDS + 20400))
          while [ $SECONDS -lt $END ]; do
            H=$(TZ=Europe/Berlin date +%-H)
            if [ "$TEST" != "true" ] && { [ "$H" -ge 23 ] || [ "$H" -lt 6 ]; }; then echo "Nachtpause – Ende"; break; fi
            START=$SECONDS
            # immer vom neuesten Stand ausgehen (auch manuelle Aktualisierungen der Folgetage)
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            if node scrape.mjs; then
              git add docs/data.json
              if ! git diff --cached --quiet; then
                git commit -q -m "Auslastung $(TZ=Europe/Berlin date +'%d.%m. %H:%M')"
                git push -q || echo "Push fehlgeschlagen – nächster Versuch in 15 Minuten"
              fi
            else
              echo "Auslese fehlgeschlagen – nächster Versuch in 15 Minuten"
              git checkout -- docs/data.json 2>/dev/null || true
            fi
            [ "$TEST" = "true" ] && break
            WAIT=$((900 - (SECONDS - START)))
            [ $WAIT -gt 0 ] && sleep $WAIT
          done
      - name: Fehlersuche-Bilder
        if: inputs.test && always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug-*.png
          if-no-files-found: ignore
